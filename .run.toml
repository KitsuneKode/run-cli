version = 1
default_profile = "dev"

[env]
PAGER = "cat"

[profiles.default]
command = "bun test"
description = "Run the full test suite once."
alias = "t"

[profiles.dev]
command = "bun test --watch"
description = "Watch tests while iterating on the CLI."
alias = "d"
env = { NODE_ENV = "development" }

[profiles.lint]
command = "bun run lint"
description = "Run Biome and MarkdownLint checks."
alias = "l"

[profiles.format]
command = "bun run format"
description = "Auto-fix formatting with Biome."
alias = "f"

[profiles.typecheck]
command = "bun run typecheck"
description = "Run TypeScript type checks."
alias = "tc"

[profiles.build]
command = "bun run build"
description = "Compile and bundle the production CLI entrypoint."
alias = "b"

[profiles.check]
command = "bun run check"
description = "Run full quality gates: typecheck + lint + tests."
alias = "ck"
